services:

  postgres:
    image: postgres:16-alpine
    container_name: searchsearcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       searchsearcher
      POSTGRES_USER:     searchsearcher
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - searchsearcher-postgres-data:/var/lib/postgresql/data
    networks:
      - searchsearcher-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchsearcher -d searchsearcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema push. Built from the Dockerfile's `builder` stage because
  # that is where drizzle-kit and the full dependency tree live; the runtime
  # image deliberately ships neither. Runs to completion, then the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: searchsearcher-migrate:latest
    container_name: searchsearcher-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://searchsearcher:${DB_PASSWORD}@postgres:5432/searchsearcher
    command: ["npx", "drizzle-kit", "push", "--config=drizzle.config.ts", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - searchsearcher-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: searchsearcher-app:latest
    container_name: searchsearcher-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://searchsearcher:${DB_PASSWORD}@postgres:5432/searchsearcher
      NODE_ENV: production
      INGEST_TOKEN: ${INGEST_TOKEN}
      # clearance.ts defaults to bsco-keycloak.fly.dev, but the fleet's realm
      # (the one reech, live-logger and the dashboards authenticate against)
      # lives here. Both are live and both answer for /realms/blacksheep, and
      # they mint DIFFERENT `iss` claims. Leave this unset and jwtVerify rejects
      # every token oauth2-proxy forwards, silently dropping every signed-in
      # user to public clearance.
      KEYCLOAK_ISSUER: https://auth.theofficialblacksheepco.com/realms/blacksheep
      CLEARANCE_ROLE: ${CLEARANCE_ROLE:-clearance-10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - searchsearcher-internal
      - traefik_proxy
    # No Traefik router of its own. The app is reachable only through
    # searchsearcher-oauth, the same shape reech, live-logger and the
    # dashboards use: Traefik -> oauth2-proxy -> upstream. A router here would
    # be a second, unauthenticated front door onto the same container.
    labels:
      - "traefik.enable=false"

  # Keycloak gate. oauth2-proxy runs as a reverse proxy (not forward-auth), so
  # an unauthenticated request never reaches Next.js at all.
  searchsearcher-oauth:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: searchsearcher-oauth
    restart: unless-stopped
    depends_on:
      - app
    command:
      - --provider=oidc
      - --oidc-issuer-url=https://auth.theofficialblacksheepco.com/realms/blacksheep
      - --client-id=searchsearcher
      - --client-secret=${SEARCHSEARCHER_OIDC_SECRET}
      - --cookie-secret=${SEARCHSEARCHER_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-domain=search.theofficialblacksheepco.com
      - --cookie-name=_oauth2_searchsearcher
      - --email-domain=*
      - --upstream=http://app:3000
      - --http-address=0.0.0.0:4180
      - --redirect-url=https://search.theofficialblacksheepco.com/oauth2/callback
      - --code-challenge-method=S256
      - --skip-provider-button=true
      - --insecure-oidc-allow-unverified-email=true
      # clearance.ts reads the bearer token off the forwarded request; without
      # these two the app sees no token and every user is public-clearance.
      - --set-xauthrequest=true
      - --pass-authorization-header=true
      - --pass-user-headers=true
      # API paths get a 401 rather than a login redirect, so a script gets an
      # error it can read instead of a page of HTML.
      - --api-route=^/api/
      - --skip-auth-preflight=true
      # The feeders (site_feeder.py, ingestor.py, autoweb.py) POST here with
      # their own INGEST_TOKEN bearer, which Keycloak knows nothing about.
      # Without this exemption the whole tagger -> ingestor pipeline 401s at
      # the edge and never reaches the route that would have authorised it.
      - --skip-auth-route=^/api/ingest$$
      - --skip-auth-route=^/api/health$$
    networks:
      - searchsearcher-internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.searchsearcher-https.rule=Host(`search.theofficialblacksheepco.com`)"
      - "traefik.http.routers.searchsearcher-https.entrypoints=websecure"
      - "traefik.http.routers.searchsearcher-https.tls=true"
      # No certresolver: search.… terminates at unit9's edge while the fleet
      # is on failover, so TLS-ALPN here can never authorize — it was burning
      # LE rate-limit budget. Re-add certresolver=myresolver if DNS returns.
      - "traefik.http.services.searchsearcher.loadbalancer.server.port=4180"

  # Publishes oauth2-proxy on the tailnet at 100.99.131.20:4180 — unit9's
  # nginx edge proxies search.theofficialblacksheepco.com through it.
  # Was an ad-hoc `docker run`; kept getting swept by compose orphan
  # handling, so it's a managed service now.
  oauth-pub:
    image: alpine/socat
    container_name: searchsearcher-oauth-pub
    restart: unless-stopped
    command: ["TCP-LISTEN:4180,fork,reuseaddr", "TCP:searchsearcher-oauth:4180"]
    ports:
      - "100.99.131.20:4180:4180"
    networks:
      - searchsearcher-internal

volumes:
  searchsearcher-postgres-data:

networks:
  searchsearcher-internal:
    driver: bridge
  traefik_proxy:
    external: true
