services:

  postgres:
    image: postgres:16-alpine
    container_name: searchsearcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       searchsearcher
      POSTGRES_USER:     searchsearcher
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - searchsearcher-postgres-data:/var/lib/postgresql/data
    networks:
      - searchsearcher-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchsearcher -d searchsearcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema push. Built from the Dockerfile's `builder` stage because
  # that is where drizzle-kit and the full dependency tree live; the runtime
  # image deliberately ships neither. Runs to completion, then the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: searchsearcher-migrate:latest
    container_name: searchsearcher-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://searchsearcher:${DB_PASSWORD}@postgres:5432/searchsearcher
    command: ["npx", "drizzle-kit", "push", "--config=drizzle.config.ts", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - searchsearcher-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: searchsearcher-app:latest
    container_name: searchsearcher-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://searchsearcher:${DB_PASSWORD}@postgres:5432/searchsearcher
      NODE_ENV: production
      INGEST_TOKEN: ${INGEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - searchsearcher-internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # HTTP -> HTTPS redirect. Redundant on unit7, whose Traefik already
      # redirects at the entrypoint (entrypoints.web.http.redirections), but
      # harmless and keeps this stack portable to a host that doesn't.
      - "traefik.http.routers.searchsearcher-http.rule=Host(`search.theofficialblacksheepco.com`)"
      - "traefik.http.routers.searchsearcher-http.entrypoints=web"
      - "traefik.http.routers.searchsearcher-http.middlewares=searchsearcher-redirect"
      - "traefik.http.middlewares.searchsearcher-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.searchsearcher-redirect.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.searchsearcher-https.rule=Host(`search.theofficialblacksheepco.com`)"
      - "traefik.http.routers.searchsearcher-https.entrypoints=websecure"
      - "traefik.http.routers.searchsearcher-https.tls=true"
      # unit7's Traefik names its ACME resolver "myresolver", not "letsencrypt".
      # A name that doesn't exist means no certificate is ever issued.
      - "traefik.http.routers.searchsearcher-https.tls.certresolver=myresolver"
      - "traefik.http.services.searchsearcher.loadbalancer.server.port=3000"

volumes:
  searchsearcher-postgres-data:

networks:
  searchsearcher-internal:
    driver: bridge
  traefik_proxy:
    external: true
